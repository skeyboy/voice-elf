<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f5" />
    <meta name="description" content="Voice Elf local real-time speech translator" />
    <link rel="icon" href="data:," />
    <style>
      #voice-elf-boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;color:#243029;background:#f4f6f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #voice-elf-boot>div{width:min(320px,calc(100vw - 48px));display:grid;justify-items:center;gap:12px;text-align:center}
      #voice-elf-boot-mark{width:44px;height:44px;display:grid;place-items:center;color:#fff;background:#25342d;border-radius:7px;box-shadow:0 8px 22px rgba(28,36,32,.16)}
      #voice-elf-boot-mark span{width:20px;height:16px;background:linear-gradient(90deg,transparent 0 8%,currentColor 8% 14%,transparent 14% 28%,currentColor 28% 38%,transparent 38% 52%,currentColor 52% 62%,transparent 62% 76%,currentColor 76% 84%,transparent 84%);color:#fff}
      #voice-elf-boot strong{font-size:15px;letter-spacing:0}
      #voice-elf-boot small{color:#69736d;font-size:11px;line-height:1.5}
      #voice-elf-boot-progress{width:132px;height:2px;overflow:hidden;background:#dce2dd;border-radius:1px}
      #voice-elf-boot-progress:after{display:block;width:42%;height:100%;content:"";background:#2f805d;animation:voice-elf-boot 1.1s ease-in-out infinite}
      @keyframes voice-elf-boot{from{transform:translateX(-110%)}to{transform:translateX(340%)}}
      @media(prefers-reduced-motion:reduce){#voice-elf-boot-progress:after{width:100%;animation:none;opacity:.7}}
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="voice-elf-boot" role="status" aria-live="polite">
      <div>
        <span id="voice-elf-boot-mark" aria-hidden="true"><span></span></span>
        <strong>正在启动 Voice Elf</strong>
        <small>正在准备本地服务与界面</small>
        <span id="voice-elf-boot-progress" aria-hidden="true"></span>
      </div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
