[package]
name = "voice-elf-app"
version = "0.1.0"
description = "Voice Elf Tauri application shell"
authors = ["Voice Elf contributors"]
edition = "2024"

[lib]
name = "voice_elf_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voice-elf-app"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
mime_guess = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
rust-embed = { version = "8.12", features = ["debug-embed", "include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread", "sync"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "set-header"] }
url = "2"

[dev-dependencies]
tempfile = "3"
