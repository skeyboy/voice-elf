[package]
name = "voice-elf-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "multipart", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
dotenvy = "0.15"
diesel = { version = "2.3", default-features = false, features = ["32-column-tables", "chrono", "postgres", "serde_json", "uuid"] }
diesel-async = { version = "0.9", features = ["postgres", "bb8"] }
diesel_migrations = "2.3"
futures-util = "0.3"
hex = "0.4"
hound = "3.5"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "multipart", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sherpa-onnx = "1.13.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip", "fs", "set-header", "trace"] }
tower-cookies = "0.11"
tonic = { version = "0.14", features = ["router"] }
tonic-prost = "0.14"
tonic-web = "0.14"
prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[build-dependencies]
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
